<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>英读助手导入器</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        color: #18201f;
        background: #f7f7f4;
        font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        color: #64706c;
        font-size: 12px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        height: 34px;
        border: 1px solid #dce3df;
        border-radius: 6px;
        padding: 0 9px;
        background: #fff;
      }
      button {
        height: 36px;
        border: 0;
        border-radius: 6px;
        padding: 0 12px;
        color: #fff;
        background: #0f766e;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        border: 1px solid #dce3df;
        color: #18201f;
        background: #fff;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .row button {
        flex: 1;
      }
      #status {
        min-height: 20px;
        margin-top: 10px;
        color: #64706c;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>保存到英读助手</h1>
    <label for="appUrl">应用地址</label>
    <input id="appUrl" placeholder="https://your-app.vercel.app" />
    <label for="token">导入 Token</label>
    <input id="token" type="password" placeholder="era_..." />
    <div class="row">
      <button id="save" class="secondary" type="button">保存配置</button>
      <button id="import" type="button">导入当前页</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
